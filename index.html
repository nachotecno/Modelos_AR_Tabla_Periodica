      --bg-color: #ffffff;
      --text-dark: #000000;
      --text-light: #ffffff;
      
      /* Paleta exacta del póster IUPAC oficial */
      --c-alcalinos: #e52420;        /* Rojo vivo */
      --c-alcalinoterreos: #f59c1a;  /* Naranja */
      --c-transicion: #fff53b;       /* Amarillo brillante */
      --c-otros-metales: #81cf74;    /* Verde claro */
      --c-semimetales: #009344;      /* Verde intenso */
      --c-no-metales: #4ec3e0;       /* Azul celeste */
      --c-halogenos: #0077c8;        /* Azul medio */
      --c-gases-nobles: #f5a3b8;     /* Rosa */
      --c-lantanidos: #e8ecf1;       /* Gris muy claro */
      --c-actinidos: #5c6bc0;        /* Azul violeta */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg-color);
      color: #111111;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      color: #000000;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: #555555;
    }

    /* Contenedor responsivo con desplazamiento suave */
    .table-viewport {
      width: 100%;
      max-width: 1260px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    /* Rejilla de 18 columnas */
    .periodic-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(62px, 1fr));
      grid-template-rows: repeat(10, minmax(64px, auto));
      gap: 3px;
      min-width: 1160px;
      margin: 0 auto;
    }

    /* Celda / Botón de elemento */
    .element-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.2);
      text-decoration: none;
      padding: 2px;
      position: relative;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      user-select: none;
    }

    .element-card:hover {
      transform: scale(1.06);
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .atomic-num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
    }

    .symbol {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 4px;
    }

    .name {
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 98%;
    }

    /* Rutherfordio completo sin desbordar */
    .element-card[data-symbol="Rf"] .name {
      font-size: 8px !important;
      letter-spacing: -0.35px;
    }

    /* Casillas especiales 57-71 Lantánidos y 89-103 Actínidos */
    .series-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.2);
      text-align: center;
      padding: 2px;
      user-select: none;
    }

    .series-marker .series-num {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .series-marker .series-name {
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Asignación cromática IUPAC */
    .alcalinos { background-color: var(--c-alcalinos); color: var(--text-light); }
    .alcalinoterreos { background-color: var(--c-alcalinoterreos); color: var(--text-dark); }
    .transicion { background-color: var(--c-transicion); color: var(--text-dark); }
    .otros-metales { background-color: var(--c-otros-metales); color: var(--text-dark); }
    .semimetales { background-color: var(--c-semimetales); color: var(--text-light); }
    .no-metales { background-color: var(--c-no-metales); color: var(--text-dark); }
    .halogenos { background-color: var(--c-halogenos); color: var(--text-light); }
    .gases-nobles { background-color: var(--c-gases-nobles); color: var(--text-dark); }
    .lantanidos { background-color: var(--c-lantanidos); color: var(--text-dark); }
    .actinidos { background-color: var(--c-actinidos); color: var(--text-light); }

    /* Separador horizontal */
    .row-separator {
      grid-column: 1 / span 18;
      height: 14px;
    }

    /* Leyenda en UNA SOLA LÍNEA */
    .legend-container {
      width: 100%;
      max-width: 1260px;
      margin-top: 14px;
      overflow-x: auto;
      padding-bottom: 6px;

      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-width: 1050px;
      background: #f7f9fa;
      border: 1px solid #dcdcdc;
      padding: 9px 14px;
      border-radius: 6px;

      font-size: 11.5px;
      font-weight: 600;
      color: #333333;

    }

      width: 15px;
      height: 15px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
